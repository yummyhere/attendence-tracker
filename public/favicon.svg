<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="geometricPrecision">
  <!-- Background: slate-900 -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>

  <!-- Clock ring (open at top-right to leave room for grid) -->
  <circle cx="15" cy="17" r="9.5" fill="none" stroke="#ffffff" stroke-width="2.2"
    stroke-dasharray="47 12" stroke-dashoffset="-6"
    stroke-linecap="round"/>

  <!-- Checkmark inside clock -->
  <polyline points="10.5,17 13.5,20.5 19.5,13.5"
    fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Grid / building motif (top-right corner) -->
  <rect x="21" y="3"  width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
  <rect x="24.5" y="3"  width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
  <rect x="21" y="6.5" width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
  <rect x="24.5" y="6.5" width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
  <rect x="21" y="10" width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
  <rect x="24.5" y="10" width="2.5" height="2.5" rx="0.4" fill="#ffffff"/>
</svg>
